---
configuration:
  username:
    name: Blink account email
    description: >-
      Leave this empty on a fresh install — the add-on's Web UI tab will ask for
      it, handle the verification code, and fill this in for you. Only set it by
      hand if you imported a session file.
  password:
    name: Blink account password
    description: >-
      Not needed, and not stored. Sign in from the Web UI tab instead; only the
      resulting session token is kept, and never your password.
  camera_name:
    name: Camera to relay
    description: >-
      Exactly as the camera appears in the Blink app. Leave empty when the
      account has a single camera. One camera per install; the Web UI lists the
      names it found after you sign in.
network:
  8554/tcp: >-
    Raw MPEG-TS relay, published on the host as 9554. Not a browser URL — point
    go2rtc or ffmpeg at it, as the Documentation tab describes.
